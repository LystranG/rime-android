# rime_mint.custom.yaml —— 薄荷全拼：候选数 / 默认中文 / 万象语法模型
# encoding: utf-8
#
# ⚠️ 本方案（全拼）不再带任何共键映射：
#   主题里的「18键」键盘已替换为四叶草分组（小鹤双拼专用，见简纯+.trime.yaml），
#   四叶草分组没有全拼所需的独立字母键（w/r/y/p/s/f/k/x/n），全拼不要切 18 键。
#   之前给全拼配的万象官方 18 键分组 derive（e→w、t→r…8 组）已移除 ——
#   它会让 26 键的候选被合并音节污染（比如打 w 出 e 类词）。
#   全拼请使用 26 键。
#
# 万象 grammar 必须内联，不能写 __include: wanxiang:/settings：
#   同一补丁文件里 __include 与 "speller/algebra/+" 并存会把方案编译坏
#   （librime 1.16 实测：部署成功但任何输入都没有候选）。
#   本文件已无 algebra 追加，但保持内联写法以绝后患。
patch:
  # 强制默认中文
  "switches/@0":
    name: ascii_mode
    reset: 0
    states: ["中文", "西文"]
  # 候选个数（薄荷把 menu 冗余写进了每个方案文件，必须在这里改才生效）
  "menu/page_size": 9

  # ===== 万象语法模型设置（wanxiang.yaml 的内容内联）=====
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5
    collocation_min_length: 2
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7
