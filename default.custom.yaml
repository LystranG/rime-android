# default.custom.yaml —— 全局补丁（Android / 同文输入法 Trime）
# encoding: utf-8
#
# 组合包说明：本目录是「oh-my-rime（薄荷）官方方案 + 万象官方简纯+ Trime 主题」的组合。
#   * 方案/词库/lua 全部来自手机上直接拉取的 oh-my-rime 仓库（官方维护）；
#   * 键盘样式/布局来自万象的 简纯+ 主题（官方维护）；
#   * 本目录只放「少量补丁」，把两者粘起来，并把 17/18 键共键映射挂上薄荷方案。
#
# ⚠️ 为什么必须覆盖 oh-my-rime 的 default.yaml（用本文件 patch）：
#   1. oh-my-rime 的 schema_list 里有 7+ 个方案（t9 在 Trime 上不可用、五笔/地球拼音用不到），
#      全部编进去首次部署会慢且多出错面；
#   2. 外部同步模式下，Trime 界面里改的方案列表会被外部文件覆盖 —— 要改就在这里改。
#
# 词库同步（重要）：double_pinyin_flypy 和 rime_mint 的 translator/dictionary 都是 rime_mint，
#   与 macOS 端 ~/Library/Rime 的两个方案同词典名 → 三端共用同一个 rime_mint.userdb，
#   各自执行「同步用户数据」即可正确合并词频（详见本目录 README 的同步一节）。
patch:
  # 物理键盘/外接键盘的中英切换行为（与 macOS 端保持一致：全部 noop，避免误切）
  "ascii_composer/switch_key":
    Caps_Lock: noop
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
  # 只保留两个主力方案（第一个是默认方案：小鹤双拼）
  schema_list:
    - schema: double_pinyin_flypy # 小鹤双拼（17 键共键见 简纯+.trime.custom.yaml）
    - schema: rime_mint           # 薄荷全拼（18 键共键，万象官方同款分组）
