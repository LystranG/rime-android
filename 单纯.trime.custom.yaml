# 单纯.trime.custom.yaml —— 给「单纯主题」补上小鹤双拼 17/18/24 键键盘 + 明暗配对
# encoding: utf-8
#
# ⚠️ 本文件由 tools/gen-theme-patches.py 自动生成，请不要手改；
#    要改键盘/配色配对，请改 trime.custom.yaml 或该脚本的表，然后重新生成。
#
# 为什么需要这个文件：
#   Trime 的主题补丁规则是「主题资源 ID + .custom.yaml」，而 trime.custom.yaml 只作用于内置主题 trime。
#   一旦在设置里把主题切换为 单纯，就必须用本文件，否则 17/18/24 键键盘与中英切换键都会消失
#   （主题会按自己的预设键盘，如 qwerty / qwerty_ / qwertys 显示）。
#
# 使用：把主题文件与下面的文件都放到 Trime 用户目录**根部**，然后【部署】并在 设置 → 主题 里选择它：
#   - 单纯.trime.yaml
#   - 单静.trime.yaml
#   - danjing.yaml
#   - 单静.patch.无障碍.yaml
#   - backgrounds/（同单静）
#
# 明暗：本文件显式写了配色配对（见文件末尾），配合 设置 → 主题 → 打开「跟随系统夜间模式」即可自动切换；
#       详见 README 第七、八节。
patch:
  # ==========================================================================
  # 1. 小鹤双拼 · 17 键（四叶草/宇宙十七键）—— 对应方案 double_pinyin_flypy_17（默认布局）
  #    字母键 17 个，3 行 6+6+5；数字行 / 功能行参考 cosmic17key 的排版
  # ==========================================================================
  "preset_keyboards/double_pinyin_flypy_17":
    name: "小鹤双拼·17键（四叶草）"
    author: "clover/forFudan 布局，Trime 移植"
    ascii_mode: 0            # 进入时默认中文
    reset_ascii_mode: true   # 切换/弹出键盘时回到 ascii_mode 指定的状态
    ascii_keyboard: flypy_en # 应用强制英文（如密码框）时自动跳到英文 26 键
    lock: true               # 切换 App 时记住本键盘
    __patch: conf/main
    width: 9                 # 默认键宽权重（整行 = 100）
    keys:
      # ---- 第 1 行：数字（上滑打符号）----
      - {click: '1', label: '1', swipe_up: '!', __include: styl/key}
      - {click: '2', label: '2', swipe_up: '@', __include: styl/key}
      - {click: '3', label: '3', swipe_up: '#', __include: styl/key}
      - {click: '4', label: '4', swipe_up: '$', __include: styl/key}
      - {click: '5', label: '5', swipe_up: '%', __include: styl/key}
      - {click: '6', label: '6', swipe_up: '^', __include: styl/key}
      - {click: '7', label: '7', swipe_up: '&', __include: styl/key}
      - {click: '8', label: '8', swipe_up: '*', __include: styl/key}
      - {click: '9', label: '9', swipe_up: '(', __include: styl/key}
      - {click: '0', label: '0', swipe_up: ')', __include: styl/key}
      - {click: Trime_transcription, width: 10, __include: styl/off_key}   # 简/繁 切换（薄荷的 transcription 开关）
      # ---- 第 2 行：QW ER TY U I OP ----
      - {click: q, label: 'QW', hint: 'iu·ei',  width: 17, __include: styl/key}
      - {click: e, label: 'ER', hint: 'e·uan',  width: 17, __include: styl/key}
      - {click: t, label: 'TY', hint: 'ue·un',  width: 17, __include: styl/key}
      - {click: u, label: 'U',  hint: 'u',      width: 16, __include: styl/key}
      - {click: i, label: 'I',  hint: 'i',      width: 16, __include: styl/key}
      - {click: o, label: 'OP', hint: 'uo·ie',  width: 17, __include: styl/key}
      # ---- 第 3 行：AS DF G H JK L ----
      - {click: a, label: 'AS', hint: 'a·ong',  width: 17, __include: styl/key}
      - {click: d, label: 'DF', hint: 'ai·en',  width: 17, __include: styl/key}
      - {click: g, label: 'G',  hint: 'eng',    width: 16, __include: styl/key}
      - {click: h, label: 'H',  hint: 'ang',    width: 16, __include: styl/key}
      - {click: j, label: 'JK', hint: 'an·ing', width: 17, __include: styl/key}
      - {click: l, label: 'L',  hint: 'iang',   width: 17, __include: styl/key}
      # ---- 第 4 行：Shift ZX C V BN M BackSpace ----
      - {click: Shift_L, width: 13}
      - {click: z, label: 'ZX', hint: 'ou·ia',   width: 18, __include: styl/key}
      - {click: c, label: 'C',  hint: 'ao',      width: 15, __include: styl/key}
      - {click: v, label: 'V',  hint: 'ui',      width: 15, __include: styl/key}
      - {click: b, label: 'BN', hint: 'in·iao',  width: 18, __include: styl/key}
      - {click: m, label: 'M',  hint: 'ian',     width: 13, __include: styl/key}
      - {click: BackSpace, width: 8}
      # ---- 第 5 行：功能行 ----
      - {click: Keyboard_flypy_en, width: 12, __include: styl/off_key}                                  # 中 → 英
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10, __include: styl/off_key}     # 符号 / 长按数字键盘（17/18/24 在方案菜单切换）
      - {click: space, swipe_up: Menu, width: 50, key_back_color: space_back_color, hilited_key_back_color: hilited_space_back_color}                              # 空格 / 上滑方案菜单（选 17/18/24 键布局）
      - {click: ',', label: '，。', swipe_up: '.', width: 10, __include: styl/key}
      - {click: Return, composing: Return1, width: 18, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color}

  # ==========================================================================
  # 2. 小鹤双拼 · 18 键 —— 17 键基础上把 BN 拆成 B / N（3 行 6+6+6）—— 对应方案 double_pinyin_flypy_18
  # ==========================================================================
  "preset_keyboards/double_pinyin_flypy_18":
    name: "小鹤双拼·18键"
    author: "clover/forFudan 布局，Trime 移植"
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: flypy_en
    lock: true
    __patch: conf/main
    width: 9
    keys:
      # ---- 第 1 行：数字 ----
      - {click: '1', label: '1', swipe_up: '!', __include: styl/key}
      - {click: '2', label: '2', swipe_up: '@', __include: styl/key}
      - {click: '3', label: '3', swipe_up: '#', __include: styl/key}
      - {click: '4', label: '4', swipe_up: '$', __include: styl/key}
      - {click: '5', label: '5', swipe_up: '%', __include: styl/key}
      - {click: '6', label: '6', swipe_up: '^', __include: styl/key}
      - {click: '7', label: '7', swipe_up: '&', __include: styl/key}
      - {click: '8', label: '8', swipe_up: '*', __include: styl/key}
      - {click: '9', label: '9', swipe_up: '(', __include: styl/key}
      - {click: '0', label: '0', swipe_up: ')', __include: styl/key}
      - {click: Trime_transcription, width: 10, __include: styl/off_key}
      # ---- 第 2 行：QW ER TY U I OP ----
      - {click: q, label: 'QW', hint: 'iu·ei',  width: 17, __include: styl/key}
      - {click: e, label: 'ER', hint: 'e·uan',  width: 17, __include: styl/key}
      - {click: t, label: 'TY', hint: 'ue·un',  width: 17, __include: styl/key}
      - {click: u, label: 'U',  hint: 'u',      width: 16, __include: styl/key}
      - {click: i, label: 'I',  hint: 'i',      width: 16, __include: styl/key}
      - {click: o, label: 'OP', hint: 'uo·ie',  width: 17, __include: styl/key}
      # ---- 第 3 行：AS DF G H JK L ----
      - {click: a, label: 'AS', hint: 'a·ong',  width: 17, __include: styl/key}
      - {click: d, label: 'DF', hint: 'ai·en',  width: 17, __include: styl/key}
      - {click: g, label: 'G',  hint: 'eng',    width: 16, __include: styl/key}
      - {click: h, label: 'H',  hint: 'ang',    width: 16, __include: styl/key}
      - {click: j, label: 'JK', hint: 'an·ing', width: 17, __include: styl/key}
      - {click: l, label: 'L',  hint: 'iang',   width: 17, __include: styl/key}
      # ---- 第 4 行：Shift ZX C V B N M BackSpace（B/N 已拆开）----
      - {click: Shift_L, width: 13}
      - {click: z, label: 'ZX', hint: 'ou·ia', width: 13, __include: styl/key}
      - {click: c, label: 'C',  hint: 'ao',    width: 12, __include: styl/key}
      - {click: v, label: 'V',  hint: 'ui',    width: 12, __include: styl/key}
      - {click: b, label: 'B',  hint: 'in',    width: 12, __include: styl/key}
      - {click: n, label: 'N',  hint: 'iao',   width: 12, __include: styl/key}
      - {click: m, label: 'M',  hint: 'ian',   width: 13, __include: styl/key}
      - {click: BackSpace, width: 13}
      # ---- 第 5 行：功能行 ----
      - {click: Keyboard_flypy_en, width: 12, __include: styl/off_key}
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10, __include: styl/off_key}
      - {click: space, swipe_up: Menu, width: 50, key_back_color: space_back_color, hilited_key_back_color: hilited_space_back_color}
      - {click: ',', label: '，。', swipe_up: '.', width: 10, __include: styl/key}
      - {click: Return, composing: Return1, width: 18, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color}

  # ==========================================================================
  # 3. 小鹤双拼 · 24 键 —— 只合并 OP、JK（3 行 9+8+7，最接近全键盘）—— 对应方案 double_pinyin_flypy_24
  # ==========================================================================
  "preset_keyboards/double_pinyin_flypy_24":
    name: "小鹤双拼·24键"
    author: "clover/forFudan 布局，Trime 移植"
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: flypy_en
    lock: true
    __patch: conf/main
    width: 9
    keys:
      # ---- 第 1 行：数字 ----
      - {click: '1', label: '1', swipe_up: '!', __include: styl/key}
      - {click: '2', label: '2', swipe_up: '@', __include: styl/key}
      - {click: '3', label: '3', swipe_up: '#', __include: styl/key}
      - {click: '4', label: '4', swipe_up: '$', __include: styl/key}
      - {click: '5', label: '5', swipe_up: '%', __include: styl/key}
      - {click: '6', label: '6', swipe_up: '^', __include: styl/key}
      - {click: '7', label: '7', swipe_up: '&', __include: styl/key}
      - {click: '8', label: '8', swipe_up: '*', __include: styl/key}
      - {click: '9', label: '9', swipe_up: '(', __include: styl/key}
      - {click: '0', label: '0', swipe_up: ')', __include: styl/key}
      - {click: Trime_transcription, width: 10, __include: styl/off_key}
      # ---- 第 2 行：Q W E R T Y U I OP ----
      - {click: q, label: 'Q',  hint: 'iu',     width: 11, __include: styl/key}
      - {click: w, label: 'W',  hint: 'ei',     width: 11, __include: styl/key}
      - {click: e, label: 'E',  hint: 'e',      width: 11, __include: styl/key}
      - {click: r, label: 'R',  hint: 'uan',    width: 11, __include: styl/key}
      - {click: t, label: 'T',  hint: 'ue',     width: 11, __include: styl/key}
      - {click: y, label: 'Y',  hint: 'un',     width: 11, __include: styl/key}
      - {click: u, label: 'U',  hint: 'u',      width: 11, __include: styl/key}
      - {click: i, label: 'I',  hint: 'i',      width: 11, __include: styl/key}
      - {click: o, label: 'OP', hint: 'uo·ie',  width: 12, __include: styl/key}
      # ---- 第 3 行：A S D F G H JK L ----
      - {click: a, label: 'A',  hint: 'a',      width: 12, __include: styl/key}
      - {click: s, label: 'S',  hint: 'ong',    width: 12, __include: styl/key}
      - {click: d, label: 'D',  hint: 'ai',     width: 12, __include: styl/key}
      - {click: f, label: 'F',  hint: 'en',     width: 12, __include: styl/key}
      - {click: g, label: 'G',  hint: 'eng',    width: 13, __include: styl/key}
      - {click: h, label: 'H',  hint: 'ang',    width: 13, __include: styl/key}
      - {click: j, label: 'JK', hint: 'an·ing', width: 13, __include: styl/key}
      - {click: l, label: 'L',  hint: 'iang',   width: 13, __include: styl/key}
      # ---- 第 4 行：Shift Z X C V B N M BackSpace ----
      - {click: Shift_L, width: 12}
      - {click: z, label: 'Z',  hint: 'ou',  width: 11, __include: styl/key}
      - {click: x, label: 'X',  hint: 'ia',  width: 11, __include: styl/key}
      - {click: c, label: 'C',  hint: 'ao',  width: 11, __include: styl/key}
      - {click: v, label: 'V',  hint: 'ui',  width: 11, __include: styl/key}
      - {click: b, label: 'B',  hint: 'in',  width: 11, __include: styl/key}
      - {click: n, label: 'N',  hint: 'iao', width: 11, __include: styl/key}
      - {click: m, label: 'M',  hint: 'ian', width: 11, __include: styl/key}
      - {click: BackSpace, width: 11}
      # ---- 第 5 行：功能行 ----
      - {click: Keyboard_flypy_en, width: 12, __include: styl/off_key}
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10, __include: styl/off_key}
      - {click: space, swipe_up: Menu, width: 50, key_back_color: space_back_color, hilited_key_back_color: hilited_space_back_color}
      - {click: ',', label: '，。', swipe_up: '.', width: 10, __include: styl/key}
      - {click: Return, composing: Return1, width: 18, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color}

  # ==========================================================================
  # 4. 英文 26 键 —— 共键键盘在英文/ASCII 模式下使用（中文键盘上的「英」键进入）
  # ==========================================================================
  "preset_keyboards/flypy_en":
    name: "英文26键"
    author: "Trime 移植（参考 Trime 内置 qwerty）"
    ascii_mode: 1
    reset_ascii_mode: true
    lock: true
    __patch: conf/main
    width: 10
    keys:
      - {click: q, label: 'Q', long_click: '1', __include: styl/key}
      - {click: w, label: 'W', long_click: '2', __include: styl/key}
      - {click: e, label: 'E', long_click: '3', __include: styl/key}
      - {click: r, label: 'R', long_click: '4', __include: styl/key}
      - {click: t, label: 'T', long_click: '5', __include: styl/key}
      - {click: y, label: 'Y', long_click: '6', __include: styl/key}
      - {click: u, label: 'U', long_click: '7', __include: styl/key}
      - {click: i, label: 'I', long_click: '8', __include: styl/key}
      - {click: o, label: 'O', long_click: '9', __include: styl/key}
      - {click: p, label: 'P', long_click: '0', __include: styl/key}
      - {width: 5}
      - {click: a, label: 'A', long_click: select_all, swipe_left: Left, swipe_right: Right, __include: styl/key}
      - {click: s, label: 'S', long_click: '~', swipe_up: Page_Up, swipe_down: Page_Down, __include: styl/key}
      - {click: d, label: 'D', long_click: '-', swipe_down: '_', __include: styl/key}
      - {click: f, label: 'F', long_click: '+', swipe_down: '=', __include: styl/key}
      - {click: g, label: 'G', long_click: '\', swipe_down: '|', __include: styl/key}
      - {click: h, label: 'H', long_click: '[]{Left}', swipe_left: '[', swipe_right: ']', __include: styl/key}
      - {click: j, label: 'J', long_click: '{}{Left}', swipe_left: '{', swipe_right: '}', __include: styl/key}
      - {click: k, label: 'K', long_click: ':', __include: styl/key}
      - {click: l, label: 'L', long_click: ';', __include: styl/key}
      - {width: 5}
      - {click: Shift_L, send_bindings: false, width: 15}
      - {click: z, label: 'Z', long_click: '`', __include: styl/key}
      - {click: x, label: 'X', long_click: cut, __include: styl/key}
      - {click: c, label: 'C', long_click: copy, __include: styl/key}
      - {click: v, label: 'V', long_click: paste, __include: styl/key}
      - {click: b, label: 'B', __include: styl/key}
      - {click: n, label: 'N', long_click: '"', __include: styl/key}
      - {click: m, label: 'M', long_click: "'", __include: styl/key}
      - {click: BackSpace, swipe_left: Escape, width: 15}
      - {click: Keyboard_flypy_zh, width: 12, __include: styl/off_key}                                  # 英 → 中（回到本方案的默认中文键盘）
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10, __include: styl/off_key}
      - {click: space, width: 38, key_back_color: space_back_color, hilited_key_back_color: hilited_space_back_color}
      - {click: ',', label: ',', swipe_up: ';', width: 10, __include: styl/key}
      - {click: '.', label: '.', swipe_up: '?', width: 10}
      - {click: Return, composing: Return1, width: 20, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color}

  # ==========================================================================
  # 5. 键盘切换按键（在 keys[] 里用名字引用）
  #    send: Eisu_toggle 是 Trime 约定的「切换键盘」信号
  # ==========================================================================
  "preset_keys/Keyboard_flypy_en":
    label: "英"
    send: Eisu_toggle
    select: flypy_en
  "preset_keys/Keyboard_flypy_zh":
    label: "中"
    send: Eisu_toggle
    select: .default      # .default = 让 Trime 按当前方案重新匹配（17/18/24 → 同名中文键盘）
  # 薄荷的简繁开关名是 transcription（见 double_pinyin_flypy.schema.yaml）
  "preset_keys/Trime_transcription":
    label: "简"
    send: SWITCH_CHARSET
    toggle: transcription
    states: [简, 繁]

  # ==========================================================================
  # 6. 可选：界面微调（不需要就整段删掉/注释）
  #    page_size（候选个数）不在这里改，见 <方案>.custom.yaml
  # ==========================================================================
  # "style/keyboard_height": 260         # 竖屏键盘总高（px）；5 行布局建议 250~270
  # "style/keyboard_height_land": 200    # 横屏
  # "style/key_long_text_size": 15       # 两个字母的键（QW、OP 等）字号
  # "style/symbol_text_size": 11         # 上滑符号 / 韵母助记(hint) 字号

  # ==========================================================================
  # 主题缺少的预设键：内置 trime.yaml 有 Return1，mint / 单静 主题没有，
  # 而我们的键盘用了 composing: Return1，所以在这里补上。
  # ==========================================================================
  "preset_keys/Return1":
    label: Enter
    send: Return

  # ==========================================================================
  # 明暗配对（「跟随系统夜间模式」用）
  # --------------------------------------------------------------------------
  # Trime 没有「分别选浅色/深色主题」的界面：它只看你当前选中的【配色】，
  # 再按该配色里的 light_scheme / dark_scheme 两个链接决定另一模式用哪个配色。
  # 这里显式写死配对，免得依赖主题（或主题变体的覆盖行为）：
  #   日间 -> google_white    夜间 -> google_black
  # 想换别的：改这两行即可（值必须是对应主题里存在的配色 ID，见主题 yaml 的 preset_color_schemes）。
  # ==========================================================================
  "preset_color_schemes/google_white/dark_scheme": google_black
  "preset_color_schemes/google_black/light_scheme": google_white
  "preset_color_schemes/default/light_scheme": google_white
  "preset_color_schemes/default/dark_scheme": google_black

  # 上面的 style 微调（键盘高度/字号）已注释掉，保留主题自己的 style；
  # 如果 17/18/24 键看起来太挤，把它们放开即可。
