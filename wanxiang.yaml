# wanxiang.yaml —— 万象模型（词库调参）设置片段
# encoding: utf-8
#
# 被方案补丁通过 __include: wanxiang:/settings 引用，例如：
#   double_pinyin_flypy.custom.yaml / rime_mint.custom.yaml 里的
#       __include: wanxiang:/settings
#
# 说明（Android / Trime）：
#   * 这里只调「万象词库 + 语言模型」的参数，词库本体由 oh-my-rime 自带的
#     dicts/rime_mint.*.dict.yaml（万象词库）提供，无需额外下载。
#   * grammar/language 指向的语法模型 wanxiang-lts-zh-hans.gram（约 400MB）本目录【没有】
#     提供：Trime 缺该文件时只会在日志里提示加载失败，并按「无语言模型」继续工作，不影响输入。
#     要启用（放到 Trime 用户目录根部，再重新部署）：
#       官方只有两个模型，都在 LTS release（长期维护、会不定期重建）：
#         wanxiang-lts-zh-hans.gram  400.5 MB  简体 ← 本配置用这个
#         wanxiang-lts-zh-hant.gram  402.2 MB  繁体（薄荷的简繁走 OpenCC，一般用不上）
#       下载页：https://github.com/amzxyz/RIME-LMDG/releases/tag/LTS
#       最省事：mac 上已有同一份文件（~/Library/Rime/wanxiang-lts-zh-hans.gram，
#               419,910,700 字节）直接拷过来，两端模型即天然一致。
#       注：Trime 3.3.12+ 若用「从外部存储同步(SAF)」模式，.gram 必须放在你授权的
#           外部目录（导入时内部多出来的文件会被当成孤儿删除）。
#   * .gram 不参与 Rime 同步（sync 里只有 *.userdb.txt 与根部 YAML/TXT 备份），
#     所以各设备需要各自放一份；但建议各设备用同一份文件，保证断句/排序一致。
settings:
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5
    collocation_min_length: 2
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7
