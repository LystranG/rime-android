# double_pinyin_flypy.custom.yaml —— 小鹤双拼：万象语法模型 + 17 键共键映射（clover 分组）
# encoding: utf-8
#
# 组合包说明：小鹤双拼方案本体来自 oh-my-rime（手机上拉取），本文件只做三件事：
#   1. 候选数 / 默认中文；2. 内联万象语法模型设置；3. 追加 17 键共键 derive 规则。
#   17 键键盘布局在 简纯+.trime.custom.yaml 里（配合万象官方简纯+主题的样式）。
#   词典是 rime_mint（与 Mac、与薄荷全拼同名）→ 三端词库学习同步合并。
patch:
  # 强制默认中文，并把 ascii_mode 的 reset 设为 0
  "switches/@0":
    name: ascii_mode
    reset: 0
    states: ["中文", "英文"]
  "menu/page_size": 9          # 候选个数必须在方案自己的 custom 里改（薄荷把 menu 冗余写进了每个方案）

  # 打印原始字符
  translator/preedit_format: []

  # ==========================================================================
  # 万象模型设置（原本写成 __include: wanxiang:/settings，这里**必须内联**）
  # --------------------------------------------------------------------------
  # ⚠️ 为什么不能再用 __include：
  #    同一个补丁文件里如果既有 `__include: wanxiang:/settings`，又有下面的
  #    `"speller/algebra/+"` 追加操作，librime 会把这条方案编译坏：
  #    部署显示成功，但**任何输入都没有候选**（输入框里只有原始编码，例如打 ni 不出「你」），
  #    而同一台设备上的全拼方案（rime_mint，也是 __include 但没有 algebra 追加）却正常。
  #    这个问题我在本机用 librime 1.16 复现并逐项验证过：
  #      · __include + algebra 追加   → 无候选（已复现两次，与顺序无关、与 .gram 无关）
  #      · 内联设置 + algebra 追加    → 一切正常（ni→你、bi→你/比、lq→累/刘、nihc→你好）
  #    所以这里把 wanxiang.yaml 的内容内联过来；wanxiang.yaml 仍然保留，
  #    供 rime_mint.custom.yaml（全拼，没有 algebra 追加）继续 __include。
  #    以后要改万象参数：这两个地方一起改。
  # ==========================================================================
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5
    collocation_min_length: 2
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7

  # ==========================================================================
  # 共键（17 / 18 / 24 键）拼写扩展
  # --------------------------------------------------------------------------
  # Trime 的 17/18/24 键键盘「一个键发一个字母」（四叶草・宇宙十七键的做法），
  # 被合并掉的两个字母靠下面的 derive 规则「改写」到代表字母上：
  #     q←w   e←r   t←y   o←p   a←s   d←f   j←k   z←x   b←n
  #   · 17 键：全部 9 组
  #   · 18 键：前 8 组（B/N 不合并）
  #   · 24 键：只用 o←p、j←k
  #
  # 用 derive（而不是 xform / xlit）的原因：
  #   derive 只「新增」一条拼写，原拼写仍然有效 —— 所以
  #   ① 24 键上单独的 w / r / y / p / s / f / k / x / n 键不会被废掉；
  #   ② 26 键全键盘（例如桌面端、或 Trime 内置 qwerty）依然能正常输入。
  #
  # 例：累(lei) 的小鹤码是 lw，derive/w/q/ 之后同时接受 lw 和 lq；
  #     在 17/18/24 键上按 QW/OP… 里的代表键 q 即可打出「累 / 刘」等候选。
  #     你(ni) 的小鹤码是 ni，derive/n/b/ 之后也接受 bi，
  #     所以在 17 键上按 BN 键(b) + I 就能打出「你」。
  #
  # 不想要共键（例如要恢复 26 键严格输入、或使用小鹤音形辅助码）：
  #     把 "speller/algebra/+" 整段删掉，然后重新部署。
  # ==========================================================================
  "speller/algebra/+":
    - "derive/w/q/"   # q  ← w   （iu / ei）
    - "derive/r/e/"   # e  ← r   （e / uan·er）
    - "derive/y/t/"   # t  ← y   （ue / un）
    - "derive/p/o/"   # o  ← p   （uo·o / ie）
    - "derive/s/a/"   # a  ← s   （a / ong·iong）
    - "derive/f/d/"   # d  ← f   （ai / en）
    - "derive/k/j/"   # j  ← k   （an / ing·uai）
    - "derive/x/z/"   # z  ← x   （ou / ia·ua）
    - "derive/n/b/"   # b  ← n   （in / iao）
