# 简纯+.trime.custom.yaml —— 给万象官方「简纯+」主题补上四叶草 17/18 键（小鹤双拼用）
# encoding: utf-8
#
# 背景：简纯+ 是 amzxyz/rime-wanxiang 官方维护的 Trime 主题（样式/26/18/14 键都调好了），
#   本补丁只做增量：加入「四叶草 17 键 / 小鹤 18 键」两套布局（配合小鹤双拼方案）。
#
# 17/18 键布局复刻四叶草官方「宇宙·十七键」（forfudan/rime-clover-flypy，theme/cosmic17key）：
#   * 合并分组与官方方案完全一致：q←w e←r t←y o←p a←s d←f j←k z←x b←n
#     （官方 xlit：qqeettuiooaaddghjjlzzcvbbm；本包用 derive 并集实现 → 26 键共存，
#      映射在 double_pinyin_flypy.custom.yaml）
#   * 行结构照抄官方：左侧 18 宽功能键（简/123/符/Shift/英）+ 两侧 1 宽留白；
#     数字行下滑中文数字；字母键上滑（部分下滑）标点
#   * 18 键：四叶草官方没有 18 键，这里是「17 键拆开 B/N」的变体（同一分组），
#     第 4 行宽度重排（Shift18 + ZX12 C11 V11 B11 N11 M12 BS12）
#
# 布局与方案的配对（重要）：
#   · 26 键（主题自带 default）→ 全拼 / 双拼都能用（derive 是并集，26 键永远不废）
#   · 18 键（主题自带 18jian）→ 配合【薄荷全拼 rime_mint】（万象官方 8 组合并，
#     映射见 rime_mint.custom.yaml）。⚠️ 它是全拼分组，双拼打不全（好=hc 的 c 没有独立键）
#   · 17 键 / 小鹤 18 键（本文件新增）→ 配合【小鹤双拼 double_pinyin_flypy】
#   · 14 键（主题自带）→ 本组合包没有加对应映射，不可用，忽略即可
#
# 切换方式：
#   1. 功能键盘（长按回车）：第 3 行 17键 | 26键 | 18键 | 14键 | 鹤18；
#   2. Trime 键盘切换列表：本包把 17jian / flypy_18jian 追加进了 style/keyboards，
#      与主题自带的 26/18/14 在同一列表里直接切换。
#
# 样式说明：按键颜色直接引用主题配色别名（main_back_color → 当前配色的圆角 key.png），
#   深浅色、谷歌白/黑等配色切换自动跟随。
patch:
  # ==========================================================================
  # 1. 四叶草 17 键（复刻官方宇宙·十七键布局，行宽全部 = 100）
  # ==========================================================================
  "preset_keyboards/17jian":
    name: 小鹤双拼·17键
    author: 'forFudan 四叶草布局，适配简纯+ 样式'
    ascii_mode: 0            # 进入时默认中文
    ascii_keyboard: letter   # 应用强制英文（如密码框）时跳到主题英文 26 键
    lock: true               # 切换 App 时记住本键盘
    horizontal_gap: 2        # 与主题键盘一致的间距/偏移
    vertical_gap: 4
    key_symbol_offset_x: 15
    key_hint_offset_x: 0
    key_hint_offset_y: -1
    key_press_offset_x: 3
    key_press_offset_y: 3
    keys:
      # ---- 第 1 行：简繁 | 数字（上滑符号，下滑中文数字）----
      - {width: 1}
      - {click: Trime_transcription, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: '1', label: '1', swipe_up: '!',  swipe_down: '一', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '2', label: '2', swipe_up: '@',  swipe_down: '二', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '3', label: '3', swipe_up: '#',  swipe_down: '三', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '4', label: '4', swipe_up: '$',  swipe_down: '四', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '5', label: '5', swipe_up: '%',  swipe_down: '五', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '6', label: '6', swipe_up: '^',  swipe_down: '六', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '7', label: '7', swipe_up: '&',  swipe_down: '七', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '8', label: '8', swipe_up: '*',  swipe_down: '八', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '9', label: '9', swipe_up: '(',  swipe_down: '九', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '0', label: '0', swipe_up: ')',  swipe_down: '〇', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      # ---- 第 2 行：123 | QW ER TY U I OP（上滑标点）----
      - {width: 1}
      - {click: Keyboard_number, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: q, label: 'QW', swipe_up: '·', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: e, label: 'ER', swipe_up: '§', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: t, label: 'TY', swipe_up: '×', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: u, label: 'U',  swipe_up: '□', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: i, label: 'I',  swipe_up: "\\", width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: o, label: 'OP', swipe_up: '/',  width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      # ---- 第 3 行：符 | AS DF G H JK L（上滑/下滑引号括号）----
      - {width: 1}
      - {click: Keyboard_symbols, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: a, label: 'AS', swipe_up: '《',           width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: d, label: 'DF', swipe_up: '》',           width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: g, label: 'G',  swipe_up: '“', swipe_down: '‘', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: h, label: 'H',  swipe_up: '”', swipe_down: '’', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: j, label: 'JK', swipe_up: '「', swipe_down: '『', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: l, label: 'L',  swipe_up: '」', swipe_down: '』', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      # ---- 第 4 行：Shift | ZX C V BN M 退格 ----
      - {width: 1}
      - {click: Shift_L, width: 18, key_back_color: off_key_back_color}
      - {width: 1}
      - {click: z, label: 'ZX', swipe_up: '……', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: c, label: 'C',  swipe_up: '——', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: v, label: 'V',  swipe_up: '：',  width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: b, label: 'BN', swipe_up: '！',  width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: m, label: 'M',  swipe_up: '？',  width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: BS, swipe_up: Escape, width: 15, key_back_color: off_key_back_color}
      # ---- 第 5 行：英 | 、； 空格 ，。 回车 ----
      - {width: 1}
      - {click: Keyboard_letter_17, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}   # 英（主题英文 26 键）
      - {width: 1}
      - {click: '、', label: '、；', swipe_up: '；', width: 12, key_symbol_offset_x: 4, __include: styl/key}
      - {click: space, swipe_up: Menu, key_symbol_offset_x: 0, width: 40, key_back_color: space_back_color, hilited_key_back_color: hilited_space_back_color}   # 空格 / 上滑方案菜单
      - {click: '，', label: '，。', swipe_up: '。', width: 12, key_symbol_offset_x: 4, __include: styl/key}
      - {click: Return, long_click: kb_func, width: 16, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color, key_symbol_color: enter_symbol_color, hilited_key_symbol_color: enter_symbol_color, key_symbol_offset_x: 0}   # 回车 / 长按功能键盘

  # ==========================================================================
  # 2. 小鹤 18 键（17 键拆开 B/N；四叶草官方无 18 键，此为同分组变体）
  #    第 4 行：Shift18 + ZX12 C11 V11 B11 N11 M12 BS12（+ 两侧留白）= 100
  # ==========================================================================
  "preset_keyboards/flypy_18jian":
    name: 小鹤双拼·18键
    author: 'forFudan 四叶草布局变体，适配简纯+ 样式'
    ascii_mode: 0
    ascii_keyboard: letter
    lock: true
    horizontal_gap: 2
    vertical_gap: 4
    key_symbol_offset_x: 15
    key_hint_offset_x: 0
    key_hint_offset_y: -1
    key_press_offset_x: 3
    key_press_offset_y: 3
    keys:
      # ---- 第 1～3、5 行与 17 键完全相同 ----
      - {width: 1}
      - {click: Trime_transcription, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: '1', label: '1', swipe_up: '!',  swipe_down: '一', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '2', label: '2', swipe_up: '@',  swipe_down: '二', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '3', label: '3', swipe_up: '#',  swipe_down: '三', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '4', label: '4', swipe_up: '$',  swipe_down: '四', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '5', label: '5', swipe_up: '%',  swipe_down: '五', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '6', label: '6', swipe_up: '^',  swipe_down: '六', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '7', label: '7', swipe_up: '&',  swipe_down: '七', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '8', label: '8', swipe_up: '*',  swipe_down: '八', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '9', label: '9', swipe_up: '(',  swipe_down: '九', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: '0', label: '0', swipe_up: ')',  swipe_down: '〇', width: 8, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {width: 1}
      - {click: Keyboard_number, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: q, label: 'QW', swipe_up: '·', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: e, label: 'ER', swipe_up: '§', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: t, label: 'TY', swipe_up: '×', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: u, label: 'U',  swipe_up: '□', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: i, label: 'I',  swipe_up: "\\", width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: o, label: 'OP', swipe_up: '/',  width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {width: 1}
      - {click: Keyboard_symbols, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: a, label: 'AS', swipe_up: '《',           width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: d, label: 'DF', swipe_up: '》',           width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: g, label: 'G',  swipe_up: '“', swipe_down: '‘', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: h, label: 'H',  swipe_up: '”', swipe_down: '’', width: 10, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: j, label: 'JK', swipe_up: '「', swipe_down: '『', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: l, label: 'L',  swipe_up: '」', swipe_down: '』', width: 15, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      # ---- 第 4 行：Shift | ZX C V B N M 退格（B/N 独立）----
      - {width: 1}
      - {click: Shift_L, width: 18, key_back_color: off_key_back_color}
      - {width: 1}
      - {click: z, label: 'ZX', swipe_up: '……', width: 12, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: c, label: 'C',  swipe_up: '——', width: 11, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: v, label: 'V',  swipe_up: '：',  width: 11, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: b, label: 'B',  swipe_up: '！',  width: 11, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: n, label: 'N',  swipe_up: '？',  width: 11, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: m, label: 'M',  swipe_up: '、',  width: 12, key_back_color: main_back_color, hilited_key_back_color: hilited_main_back_color}
      - {click: BS, swipe_up: Escape, width: 12, key_back_color: off_key_back_color}
      # ---- 第 5 行：与 17 键相同 ----
      - {width: 1}
      - {click: Keyboard_letter_17, width: 18, key_back_color: off_key_back_color, __include: styl/off_key}
      - {width: 1}
      - {click: '、', label: '、；', swipe_up: '；', width: 12, key_symbol_offset_x: 4, __include: styl/key}
      - {click: space, swipe_up: Menu, key_symbol_offset_x: 0, width: 40, key_back_color: space_back_color, hilited_key_back_color: hilited_space_back_color}
      - {click: '，', label: '，。', swipe_up: '。', width: 12, key_symbol_offset_x: 4, __include: styl/key}
      - {click: Return, long_click: kb_func, width: 16, key_back_color: enter_back_color, hilited_key_back_color: hilited_enter_back_color, key_text_color: enter_text_color, hilited_key_text_color: enter_text_color, key_symbol_color: enter_symbol_color, hilited_key_symbol_color: enter_symbol_color, key_symbol_offset_x: 0}

  # ==========================================================================
  # 3. 本包新增的预设按键
  # ==========================================================================
  # 简繁切换（薄荷方案的 transcription 开关；对应官方宇宙十七键的「繁简`」键位）
  "preset_keys/Trime_transcription":
    label: 简
    send: SWITCH_CHARSET
    toggle: transcription
    states: [简, 繁]
  # 主题没有单数的 Keyboard_symbols（只有 18/14 前缀版），补一个通用符号键（官方 label「符」）
  "preset_keys/Keyboard_symbols": { label: '符', send: Eisu_toggle, select: symbols }
  # 中 → 英（主题英文 26 键；对应官方的 abc 键位）
  "preset_keys/Keyboard_letter_17": { label: 英, send: Eisu_toggle, select: letter }
  # 功能键盘按钮
  "preset_keys/kb_17jian":  { label: 'ic@keyboard', send: Eisu_toggle, select: 17jian }        # 17键（小鹤双拼）
  "preset_keys/kb_flypy18": { label: 'ic@keyboard', send: Eisu_toggle, select: flypy_18jian } # 鹤18（小鹤双拼）

  # ==========================================================================
  # 4. 键盘切换列表：把 17/18 键追加进主题的 style/keyboards，
  #    与主题自带的 26/18/14 在同一列表里直接切换（设置/键盘菜单）
  # ==========================================================================
  "style/keyboards/+":
    - 17jian
    - flypy_18jian

  # ==========================================================================
  # 5. 功能键盘挂 17 键 / 小鹤 18 键按钮
  #    主题 func 键盘第 3 行是：占位 | 26键 | 18键 | 14键 | 占位
  #    两个占位键（无论 0/1 基索引都落在 Keyboard_func1 空白键上）分别替换成：
  #      @10 → 17 键（小鹤双拼）      @14 → 小鹤 18 键
  #    第 3 行变成：17键 | 26键 | 18键 | 14键 | 鹤18，宽度 12.5+25+25+25+12.5 = 100
  # ==========================================================================
  "preset_keyboards/func/keys/@10/":
    click: kb_17jian
    hint: '17键'
    width: 12.5
    __include: styl/off_func
  "preset_keyboards/func/keys/@14/":
    click: kb_flypy18
    hint: '鹤18'
    width: 12.5
    __include: styl/off_func

  # ==========================================================================
  # 6. 给主题自带的 18 键键盘补 ascii_keyboard（应用强制英文时自动跳英文 26 键）
  # ==========================================================================
  "preset_keyboards/18jian/ascii_keyboard": letter
