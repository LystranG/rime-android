# trime.custom.yaml —— 同文输入法(Trime / Android) 前端主题补丁
# encoding: utf-8
#
# 作用：把四叶草·宇宙十七键(clover / 小鹤双拼 14·17 键)风格的键盘，移植成 Trime 的
#       17 / 18 / 24 键中文键盘 + 一个英文 26 键键盘。
#
# 放置位置（Trime 会按 librime 惯例把本文件的 patch 自动合并到内置 trime.yaml 上）：
#   * Trime ≤ 3.3.11：<用户文件夹> = /storage/emulated/0/rime/       → 放这里
#   * Trime ≥ 3.3.12：<用户文件夹> = /storage/emulated/0/Android/data/com.osfans.trime/files/rime/
#                     （若在设置里选了「从外部存储同步」，则放在你授权的外部目录里，部署时会导入）
#   * 本文件请与 oh-my-rime 的其它文件一起放到同一个用户文件夹根目录。
#
# 布局与方案的绑定（Trime 源码 KeyboardWindow.smartMatchKeyboard）：
#   ① 键盘 ID == 方案 schema_id  → 切到该方案时自动使用该键盘（最高优先级）
#   ② 否则按 speller/alphabet 匹配（26 个字母 → 内置 qwerty 26 键）
#   所以这里把 17 键布局直接命名为 double_pinyin_flypy（小鹤双拼的方案 ID），
#   这样「小鹤双拼-薄荷定制」默认就是 17 键；薄荷全拼(rime_mint)会自动用内置 26 键。
#   想换默认布局：把下面的 "preset_keyboards/double_pinyin_flypy" 换成
#   import_preset: flypy_18 / flypy_24，或直接把 18/24 键的 keys 复制过去。
#
# 共键原理（重要）：
#   17/18/24 键键盘一个键只发一个字母（四叶草做法），被合并掉的两个字母靠
#   double_pinyin_flypy.custom.yaml 里的 derive 规则「改写」到代表字母上：
#       q←w   e←r   t←y   o←p   a←s   d←f   j←k   z←x   b←n
#   17 键用全部 9 组；18 键用前 8 组（b/n 不合并）；24 键只用 o←p、j←k。
#   derive 只新增拼写、保留原拼写，所以 26 键全键盘依然能正常输入，不会出现「死键」。
#
# 使用窍门（共键键 = 模糊，未合并的字母键 = 精确）：
#   · 18 键：B 键同时给 b-/n- 候选；要精确的 n 声母或 iao 韵母就用 N 键。
#   · 24 键：OP 键(发 o) 同时给 uo/o 与 ie，JK 键(发 j) 同时给 an 与 ing/uai；
#            W(ei)/R(uan)/Y(un)/S(ong)/F(en)/X(ia)/N(iao) 都只有一种读音，按 26 键习惯打即可。

patch:
  # ==========================================================================
  # 1. 小鹤双拼 · 17 键（四叶草/宇宙十七键）—— 小鹤双拼方案的默认键盘
  #    字母键 17 个，3 行 6+6+5；数字行 / 功能行参考 cosmic17key 的排版
  # ==========================================================================
  "preset_keyboards/double_pinyin_flypy":
    name: "小鹤双拼·17键（四叶草）"
    author: "clover/forFudan 布局，Trime 移植"
    ascii_mode: 0            # 进入时默认中文
    reset_ascii_mode: true   # 切换/弹出键盘时回到 ascii_mode 指定的状态
    ascii_keyboard: flypy_en # 应用强制英文（如密码框）时自动跳到英文 26 键
    lock: true               # 切换 App 时记住本键盘
    width: 9                 # 默认键宽权重（整行 = 100）
    height: 44               # 默认行高（最终按 style/keyboard_height 等比缩放）
    keys:
      # ---- 第 1 行：数字（上滑打符号）----
      - {click: '1', label: '1', swipe_up: '!', height: 34}
      - {click: '2', label: '2', swipe_up: '@'}
      - {click: '3', label: '3', swipe_up: '#'}
      - {click: '4', label: '4', swipe_up: '$'}
      - {click: '5', label: '5', swipe_up: '%'}
      - {click: '6', label: '6', swipe_up: '^'}
      - {click: '7', label: '7', swipe_up: '&'}
      - {click: '8', label: '8', swipe_up: '*'}
      - {click: '9', label: '9', swipe_up: '('}
      - {click: '0', label: '0', swipe_up: ')'}
      - {click: Trime_transcription, width: 10}   # 简/繁 切换（薄荷的 transcription 开关）
      # ---- 第 2 行：QW ER TY U I OP ----
      - {click: q, label: 'QW', hint: 'iu·ei',  width: 17}
      - {click: e, label: 'ER', hint: 'e·uan',  width: 17}
      - {click: t, label: 'TY', hint: 'ue·un',  width: 17}
      - {click: u, label: 'U',  hint: 'u',      width: 16}
      - {click: i, label: 'I',  hint: 'i',      width: 16}
      - {click: o, label: 'OP', hint: 'uo·ie',  width: 17}
      # ---- 第 3 行：AS DF G H JK L ----
      - {click: a, label: 'AS', hint: 'a·ong',  width: 17}
      - {click: d, label: 'DF', hint: 'ai·en',  width: 17}
      - {click: g, label: 'G',  hint: 'eng',    width: 16}
      - {click: h, label: 'H',  hint: 'ang',    width: 16}
      - {click: j, label: 'JK', hint: 'an·ing', width: 17}
      - {click: l, label: 'L',  hint: 'iang',   width: 17}
      # ---- 第 4 行：Shift ZX C V BN M BackSpace ----
      - {click: Shift_L, width: 13}
      - {click: z, label: 'ZX', hint: 'ou·ia',   width: 18}
      - {click: c, label: 'C',  hint: 'ao',      width: 15}
      - {click: v, label: 'V',  hint: 'ui',      width: 15}
      - {click: b, label: 'BN', hint: 'in·iao',  width: 18}
      - {click: m, label: 'M',  hint: 'ian',     width: 13}
      - {click: BackSpace, width: 8}
      # ---- 第 5 行：功能行 ----
      - {click: Keyboard_flypy_en, width: 12}                                  # 中 → 英
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10}     # 符号 / 长按数字键盘
      - {click: Keyboard_flypy_17, width: 8}                                   # 切到 17 键
      - {click: Keyboard_flypy_18, width: 8}                                   # 切到 18 键
      - {click: Keyboard_flypy_24, width: 8}                                   # 切到 24 键
      - {click: space, swipe_up: Menu, width: 26}                              # 空格 / 上滑方案菜单
      - {click: ',', label: '，。', swipe_up: '.', width: 10}
      - {click: Return, composing: Return1, width: 18}

  # ==========================================================================
  # 2. 小鹤双拼 · 18 键 —— 17 键基础上把 BN 拆成 B / N（3 行 6+6+6）
  # ==========================================================================
  "preset_keyboards/flypy_18":
    name: "小鹤双拼·18键"
    author: "clover/forFudan 布局，Trime 移植"
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: flypy_en
    lock: true
    width: 9
    height: 44
    keys:
      # ---- 第 1 行：数字 ----
      - {click: '1', label: '1', swipe_up: '!', height: 34}
      - {click: '2', label: '2', swipe_up: '@'}
      - {click: '3', label: '3', swipe_up: '#'}
      - {click: '4', label: '4', swipe_up: '$'}
      - {click: '5', label: '5', swipe_up: '%'}
      - {click: '6', label: '6', swipe_up: '^'}
      - {click: '7', label: '7', swipe_up: '&'}
      - {click: '8', label: '8', swipe_up: '*'}
      - {click: '9', label: '9', swipe_up: '('}
      - {click: '0', label: '0', swipe_up: ')'}
      - {click: Trime_transcription, width: 10}
      # ---- 第 2 行：QW ER TY U I OP ----
      - {click: q, label: 'QW', hint: 'iu·ei',  width: 17}
      - {click: e, label: 'ER', hint: 'e·uan',  width: 17}
      - {click: t, label: 'TY', hint: 'ue·un',  width: 17}
      - {click: u, label: 'U',  hint: 'u',      width: 16}
      - {click: i, label: 'I',  hint: 'i',      width: 16}
      - {click: o, label: 'OP', hint: 'uo·ie',  width: 17}
      # ---- 第 3 行：AS DF G H JK L ----
      - {click: a, label: 'AS', hint: 'a·ong',  width: 17}
      - {click: d, label: 'DF', hint: 'ai·en',  width: 17}
      - {click: g, label: 'G',  hint: 'eng',    width: 16}
      - {click: h, label: 'H',  hint: 'ang',    width: 16}
      - {click: j, label: 'JK', hint: 'an·ing', width: 17}
      - {click: l, label: 'L',  hint: 'iang',   width: 17}
      # ---- 第 4 行：Shift ZX C V B N M BackSpace（B/N 已拆开）----
      - {click: Shift_L, width: 13}
      - {click: z, label: 'ZX', hint: 'ou·ia', width: 13}
      - {click: c, label: 'C',  hint: 'ao',    width: 12}
      - {click: v, label: 'V',  hint: 'ui',    width: 12}
      - {click: b, label: 'B',  hint: 'in',    width: 12}
      - {click: n, label: 'N',  hint: 'iao',   width: 12}
      - {click: m, label: 'M',  hint: 'ian',   width: 13}
      - {click: BackSpace, width: 13}
      # ---- 第 5 行：功能行 ----
      - {click: Keyboard_flypy_en, width: 12}
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10}
      - {click: Keyboard_flypy_17, width: 8}
      - {click: Keyboard_flypy_18, width: 8}
      - {click: Keyboard_flypy_24, width: 8}
      - {click: space, swipe_up: Menu, width: 26}
      - {click: ',', label: '，。', swipe_up: '.', width: 10}
      - {click: Return, composing: Return1, width: 18}

  # ==========================================================================
  # 3. 小鹤双拼 · 24 键 —— 只合并 OP、JK（3 行 9+8+7，最接近全键盘）
  # ==========================================================================
  "preset_keyboards/flypy_24":
    name: "小鹤双拼·24键"
    author: "clover/forFudan 布局，Trime 移植"
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: flypy_en
    lock: true
    width: 9
    height: 44
    keys:
      # ---- 第 1 行：数字 ----
      - {click: '1', label: '1', swipe_up: '!', height: 34}
      - {click: '2', label: '2', swipe_up: '@'}
      - {click: '3', label: '3', swipe_up: '#'}
      - {click: '4', label: '4', swipe_up: '$'}
      - {click: '5', label: '5', swipe_up: '%'}
      - {click: '6', label: '6', swipe_up: '^'}
      - {click: '7', label: '7', swipe_up: '&'}
      - {click: '8', label: '8', swipe_up: '*'}
      - {click: '9', label: '9', swipe_up: '('}
      - {click: '0', label: '0', swipe_up: ')'}
      - {click: Trime_transcription, width: 10}
      # ---- 第 2 行：Q W E R T Y U I OP ----
      - {click: q, label: 'Q',  hint: 'iu',     width: 11}
      - {click: w, label: 'W',  hint: 'ei',     width: 11}
      - {click: e, label: 'E',  hint: 'e',      width: 11}
      - {click: r, label: 'R',  hint: 'uan',    width: 11}
      - {click: t, label: 'T',  hint: 'ue',     width: 11}
      - {click: y, label: 'Y',  hint: 'un',     width: 11}
      - {click: u, label: 'U',  hint: 'u',      width: 11}
      - {click: i, label: 'I',  hint: 'i',      width: 11}
      - {click: o, label: 'OP', hint: 'uo·ie',  width: 12}
      # ---- 第 3 行：A S D F G H JK L ----
      - {click: a, label: 'A',  hint: 'a',      width: 12}
      - {click: s, label: 'S',  hint: 'ong',    width: 12}
      - {click: d, label: 'D',  hint: 'ai',     width: 12}
      - {click: f, label: 'F',  hint: 'en',     width: 12}
      - {click: g, label: 'G',  hint: 'eng',    width: 13}
      - {click: h, label: 'H',  hint: 'ang',    width: 13}
      - {click: j, label: 'JK', hint: 'an·ing', width: 13}
      - {click: l, label: 'L',  hint: 'iang',   width: 13}
      # ---- 第 4 行：Shift Z X C V B N M BackSpace ----
      - {click: Shift_L, width: 12}
      - {click: z, label: 'Z',  hint: 'ou',  width: 11}
      - {click: x, label: 'X',  hint: 'ia',  width: 11}
      - {click: c, label: 'C',  hint: 'ao',  width: 11}
      - {click: v, label: 'V',  hint: 'ui',  width: 11}
      - {click: b, label: 'B',  hint: 'in',  width: 11}
      - {click: n, label: 'N',  hint: 'iao', width: 11}
      - {click: m, label: 'M',  hint: 'ian', width: 11}
      - {click: BackSpace, width: 11}
      # ---- 第 5 行：功能行 ----
      - {click: Keyboard_flypy_en, width: 12}
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10}
      - {click: Keyboard_flypy_17, width: 8}
      - {click: Keyboard_flypy_18, width: 8}
      - {click: Keyboard_flypy_24, width: 8}
      - {click: space, swipe_up: Menu, width: 26}
      - {click: ',', label: '，。', swipe_up: '.', width: 10}
      - {click: Return, composing: Return1, width: 18}

  # ==========================================================================
  # 4. 英文 26 键 —— 共键键盘在英文/ASCII 模式下使用（中文键盘上的「英」键进入）
  # ==========================================================================
  "preset_keyboards/flypy_en":
    name: "英文26键"
    author: "Trime 移植（参考 Trime 内置 qwerty）"
    ascii_mode: 1
    reset_ascii_mode: true
    lock: true
    width: 10
    height: 44
    keys:
      - {click: q, label: 'Q', long_click: '1'}
      - {click: w, label: 'W', long_click: '2'}
      - {click: e, label: 'E', long_click: '3'}
      - {click: r, label: 'R', long_click: '4'}
      - {click: t, label: 'T', long_click: '5'}
      - {click: y, label: 'Y', long_click: '6'}
      - {click: u, label: 'U', long_click: '7'}
      - {click: i, label: 'I', long_click: '8'}
      - {click: o, label: 'O', long_click: '9'}
      - {click: p, label: 'P', long_click: '0'}
      - {width: 5}
      - {click: a, label: 'A', long_click: select_all, swipe_left: Left, swipe_right: Right}
      - {click: s, label: 'S', long_click: '~', swipe_up: Page_Up, swipe_down: Page_Down}
      - {click: d, label: 'D', long_click: '-', swipe_down: '_'}
      - {click: f, label: 'F', long_click: '+', swipe_down: '='}
      - {click: g, label: 'G', long_click: '\', swipe_down: '|'}
      - {click: h, label: 'H', long_click: '[]{Left}', swipe_left: '[', swipe_right: ']'}
      - {click: j, label: 'J', long_click: '{}{Left}', swipe_left: '{', swipe_right: '}'}
      - {click: k, label: 'K', long_click: ':'}
      - {click: l, label: 'L', long_click: ';'}
      - {width: 5}
      - {click: Shift_L, send_bindings: false, width: 15}
      - {click: z, label: 'Z', long_click: '`'}
      - {click: x, label: 'X', long_click: cut}
      - {click: c, label: 'C', long_click: copy}
      - {click: v, label: 'V', long_click: paste}
      - {click: b, label: 'B'}
      - {click: n, label: 'N', long_click: '"'}
      - {click: m, label: 'M', long_click: "'"}
      - {click: BackSpace, swipe_left: Escape, width: 15}
      - {click: Keyboard_flypy_zh, width: 12}                                  # 英 → 中（回到本方案的默认中文键盘）
      - {click: Keyboard_symbols, long_click: Keyboard_number, width: 10}
      - {click: space, width: 38}
      - {click: ',', label: ',', swipe_up: ';', width: 10}
      - {click: '.', label: '.', swipe_up: '?', width: 10}
      - {click: Return, composing: Return1, width: 20}

  # ==========================================================================
  # 5. 键盘切换按键（在 keys[] 里用名字引用）
  #    send: Eisu_toggle 是 Trime 约定的「切换键盘」信号
  # ==========================================================================
  "preset_keys/Keyboard_flypy_17":
    label: "17"
    send: Eisu_toggle
    select: double_pinyin_flypy
  "preset_keys/Keyboard_flypy_18":
    label: "18"
    send: Eisu_toggle
    select: flypy_18
  "preset_keys/Keyboard_flypy_24":
    label: "24"
    send: Eisu_toggle
    select: flypy_24
  "preset_keys/Keyboard_flypy_en":
    label: "英"
    send: Eisu_toggle
    select: flypy_en
  "preset_keys/Keyboard_flypy_zh":
    label: "中"
    send: Eisu_toggle
    select: .default      # .default = 让 Trime 按当前方案重新匹配（小鹤双拼 → 17 键）
  # 薄荷的简繁开关名是 transcription（见 double_pinyin_flypy.schema.yaml）
  "preset_keys/Trime_transcription":
    label: "简"
    send: SWITCH_CHARSET
    toggle: transcription
    states: [简, 繁]

  # ==========================================================================
  # 6. 可选：界面微调（不需要就整段删掉/注释）
  #    page_size（候选个数）不在这里改，见 <方案>.custom.yaml
  # ==========================================================================
  "style/keyboard_height": 260         # 竖屏键盘总高（px）；5 行布局建议 250~270
  "style/keyboard_height_land": 200    # 横屏
  "style/key_long_text_size": 15       # 两个字母的键（QW、OP 等）字号
  "style/symbol_text_size": 11         # 上滑符号 / 韵母助记(hint) 字号
